name: BYOK preset contract

# Family plan 17 Layer "Gate tooling" — vendored copy of dev's
# check-byok-contract.sh (must stay byte-identical; drift is caught by
# dev's verify-wiring.sh). Runs beside the AI alignment gate (same CI
# wiring rule, different concern: contract vs layering).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'scripts/check-byok-contract.sh'
      - 'scripts/sync-ai-presets.mjs'
      - '.github/workflows/byok-contract.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'scripts/check-byok-contract.sh'
      - 'scripts/sync-ai-presets.mjs'
      - '.github/workflows/byok-contract.yml'
  workflow_dispatch:

jobs:
  byok:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run BYOK contract gate
        run: bash scripts/check-byok-contract.sh --self
