name: Release install smoke

# G4 (plan 69 §6) — guards the published one-line install end-to-end on a
# clean runner, from the release assets only (no checkout, no source): the
# versioned bootstrap resolves the tag, verifies the bundle's SHA-256
# against SHA256SUMS, --dry-run writes nothing, the real install boots the
# pinned stack (never :latest), writes docker/.env at 0600, waits on
# study's health path (/api/v1/health — installer.json healthPath, NOT
# career/health's /health) and a re-run of install.sh keeps docker/.env
# byte-identical.
#
# Trigger: the Release workflow completing on a tag (workflow_run), or a
# manual dispatch with an explicit tag. The workflow_run event fires after
# the whole Release workflow is done, so all assets should already be
# attached (the release job is the single latest-marker and needs
# deploy-bundle); the bounded wait below only covers asset-listing
# propagation. The smoke is post-publish by design, like the family seed:
# a red run marks the release broken (plan 69 §6: a supported path is
# supported only when G4 is green), it cannot un-publish it.
#
# Study's five per-instance secrets are generated by the installer and are
# never printed; this smoke asserts their presence (non-empty) and their
# absence from the installer's output, never their values.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to smoke-test (e.g. v0.13.1)
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: One-line install from the published release (G4)
    # workflow_dispatch: explicit tag. workflow_run: only a successful
    # tag-push run of the Release workflow — its manual-dispatch path has
    # no tag, and a half-failed release has nothing to smoke.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SMOKE_PORT: "8091"
      # The installer's health wait (scripts/lib-docker.sh) — up to five
      # minutes for the db init + one-shot migrate + app boot chain.
      HEALTH_WAIT_INTERVAL: "5"
      HEALTH_WAIT_ATTEMPTS: "60"
    steps:
      - name: Resolve the release tag and wait for its assets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::no release tag to smoke (got: '${TAG}')" >&2; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "smoking release $TAG of ${{ github.repository }}"
          missing=""
          for attempt in $(seq 1 30); do
            have="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=""
            for f in "study-compose-${TAG}.tar.gz" manifest.json SHA256SUMS \
                     "study-bootstrap-${TAG}.sh" study-bootstrap.sh; do
              grep -qx "$f" <<<"$have" || missing="$missing $f"
            done
            if [ -z "$missing" ]; then
              echo "all five release assets present (attempt ${attempt})"
              exit 0
            fi
            echo "waiting for the release assets (attempt ${attempt}/30):$missing"
            sleep 20
          done
          echo "::error::release $TAG is still missing assets after ~10 minutes:$missing" >&2
          exit 1

      - name: Download the release assets and verify their checksums
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-assets"
          rm -rf "$dir"; mkdir -p "$dir"
          gh release download "$TAG" --dir "$dir" --clobber \
            --pattern "study-compose-${TAG}.tar.gz" \
            --pattern manifest.json \
            --pattern SHA256SUMS \
            --pattern "study-bootstrap-${TAG}.sh" \
            --pattern study-bootstrap.sh
          ls -l "$dir"
          cd "$dir"
          sha256sum -c SHA256SUMS
          # The versioned bootstrap and the version-free alias must be the
          # same bytes (the alias is what neuronection.com/install/study.sh
          # 302s to).
          cmp study-bootstrap.sh "study-bootstrap-${TAG}.sh"

      - name: Bootstrap dry-run verifies the release and writes nothing
        run: |
          set -euo pipefail
          set +e
          out="$(bash "$RUNNER_TEMP/release-assets/study-bootstrap-${TAG}.sh" \
            --ref "$TAG" --dir "$RUNNER_TEMP/study" --dry-run 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || { echo "::error::the bootstrap dry-run failed (exit $status)"; exit 1; }
          grep -q "Dry run OK" <<<"$out"
          grep -qF "Release:    $TAG" <<<"$out"
          grep -Eq 'app=ghcr\.io/[^ ]+@sha256:[0-9a-f]{64}' <<<"$out"
          grep -q -- "--image app=" <<<"$out"
          [ ! -e "$RUNNER_TEMP/study" ] || { echo "::error::--dry-run created the target directory"; exit 1; }
          echo "dry run resolved $TAG, printed the digest pin and wrote nothing into $RUNNER_TEMP/study"

      - name: Install the release (digest pin, docker/.env 0600, /api/v1/health)
        run: |
          set -euo pipefail
          set +e
          out="$(bash "$RUNNER_TEMP/release-assets/study-bootstrap-${TAG}.sh" \
            --ref "$TAG" --dir "$RUNNER_TEMP/study" -- --http-port "$SMOKE_PORT" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || { echo "::error::the one-line install failed (exit $status)"; exit 1; }
          grep -q "Handing off to the bundle's own installer" <<<"$out"
          grep -q "App is healthy" <<<"$out"

          cd "$RUNNER_TEMP/study"
          # docker/.env: created 0600 with the release digest pin and
          # study's five per-instance secrets generated (presence only —
          # values are random per run, never asserted, never printed).
          [ -f docker/.env ] || { echo "::error::install completed without docker/.env"; exit 1; }
          [ "$(stat -c %a docker/.env)" = "600" ] || { echo "::error::docker/.env is not 0600"; exit 1; }
          grep -qE '^STUDY_IMAGE=ghcr\.io/[^ ]+@sha256:[0-9a-f]{64}$' docker/.env \
            || { echo "::error::the release digest pin did not land in docker/.env"; exit 1; }
          for key in SA_SESSION_KEY SA_REFRESH_KEY SA_DATA_KEY SA_DB_OWNER_PASSWORD SA_DB_PASSWORD; do
            grep -qE "^${key}=..+$" docker/.env || { echo "::error::$key was not generated"; exit 1; }
          done
          # G8: the installer prints none of the five secrets (grep -qF
          # keeps the values out of this log even on failure).
          while IFS='=' read -r k v; do
            case "$k" in
              SA_SESSION_KEY|SA_REFRESH_KEY|SA_DATA_KEY|SA_DB_OWNER_PASSWORD|SA_DB_PASSWORD)
                [ -n "$v" ] || continue
                if grep -qF -- "$v" <<<"$out"; then
                  echo "::error::$k was printed by the installer"
                  exit 1
                fi
                ;;
            esac
          done < docker/.env

          # Study's health path is /api/v1/health (installer.json
          # healthPath), NOT /health — career/health's path would 404
          # here. The installer already waited on it; assert it directly.
          HEALTH_PATH="$(python3 -c 'import json; print(json.load(open("installer.json"))["healthPath"])')"
          [ "$HEALTH_PATH" = "/api/v1/health" ] \
            || { echo "::error::installer.json healthPath is '${HEALTH_PATH}' — study's health endpoint is /api/v1/health"; exit 1; }
          grep -q "$HEALTH_PATH" <<<"$out"
          curl -fsS "http://127.0.0.1:${SMOKE_PORT}${HEALTH_PATH}" | grep -q '"status"'

          # The rendered stack never falls back to a mutable ref (G8:
          # no :latest / :main) and carries the release digest.
          docker compose --env-file docker/.env -f docker/docker-compose.standalone.yml config \
            | sed -n 's/^[[:space:]]*image:[[:space:]]*//p' | sed 's/^"\(.*\)"$/\1/' | sort -u \
            | tee "$RUNNER_TEMP/images.txt"
          grep -qE '@sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/images.txt" \
            || { echo "::error::the rendered app image is not the release digest"; exit 1; }
          if grep -qE ':latest(:|@|$)' "$RUNNER_TEMP/images.txt"; then
            echo "::error::the rendered stack uses :latest — a release install must pin its images"
            exit 1
          fi
          if grep -qE ':main(:|@|$)' "$RUNNER_TEMP/images.txt"; then
            echo "::error::the rendered stack uses :main — never a branch ref"
            exit 1
          fi

      - name: Re-run install.sh keeps docker/.env byte-identical
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/study"
          BEFORE="$(sha256sum docker/.env | awk '{print $1}')"
          set +e
          out="$(bash scripts/install.sh --http-port "$SMOKE_PORT" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || { echo "::error::the install.sh re-run failed (exit $status)"; exit 1; }
          grep -q "leaving it untouched" <<<"$out"
          AFTER="$(sha256sum docker/.env | awk '{print $1}')"
          [ "$BEFORE" = "$AFTER" ] || { echo "::error::the re-run rewrote docker/.env"; exit 1; }
          curl -fsS "http://127.0.0.1:${SMOKE_PORT}/api/v1/health" | grep -q '"status"'
          echo "re-run kept docker/.env byte-identical and refreshed the stack"

      - name: Tear the smoke stack down
        if: always()
        run: |
          set -u
          cd "$RUNNER_TEMP/study" 2>/dev/null || exit 0
          env_file="docker/.env"
          [ -f "$env_file" ] || env_file=".env"
          [ -f "$env_file" ] || exit 0
          docker compose --env-file "$env_file" -f docker/docker-compose.standalone.yml down -v >/dev/null 2>&1 || true
