name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # ADR-0022: web mode runs PostgreSQL 16 (pgvector) — migrations must
        # upgrade cleanly on both dialects (SQLite runs via pytest + alembic).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuro_study
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (editable path dep)
        run: |
          if [ ! -d ../auth-kit ]; then
            git clone --depth 1 https://github.com/neuronection/auth-kit ../auth-kit \
              || echo "::warning::neuronection/auth-kit not fetchable — required while pyproject.toml pins it as an editable ../auth-kit path dep"
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter frontend test
      - run: pnpm --filter frontend build
      - run: uv sync --frozen
      - run: uv run --directory backend ruff check .
      - run: uv run --directory backend mypy .
      - run: uv run --directory backend pytest
        env:
          SA_DATA_DIR: ${{ runner.temp }}/sa-data
      - run: uv run --directory backend alembic upgrade head
        env:
          SA_DATA_DIR: ${{ runner.temp }}/sa-data
      - name: Migrations on PostgreSQL 16 (second dialect)
        run: uv run --directory backend alembic upgrade head
        env:
          SA_DATA_DIR: ${{ runner.temp }}/sa-data-pg
          SA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/neuro_study
      - name: Create PostgreSQL test database (neuro_study_test)
        run: >
          docker run --rm --network host pgvector/pgvector:pg16
          psql "postgresql://postgres:postgres@localhost:5432/postgres"
          -c "CREATE DATABASE neuro_study_test"
      - name: PostgreSQL dialect tests (postgres-gated modules)
        env:
          SA_DATA_DIR: ${{ runner.temp }}/sa-data-pg
          SA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/neuro_study_test
        run: |
          set +e
          uv run --directory backend pytest tests/ -k postgres
          code=$?
          set -e
          # Exit 5 = no tests matched the postgres selection (the gated
          # modules are still landing) — tolerate that and nothing else.
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi
      - name: E2E smoke (Playwright, mock provider)
        run: |
          pnpm --filter frontend exec playwright install --with-deps chromium
          pnpm --filter frontend e2e

  linux:
    needs: test
    runs-on: ubuntu-22.04
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: "never"
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (editable path dep)
        run: |
          if [ ! -d ../auth-kit ]; then
            git clone --depth 1 https://github.com/neuronection/auth-kit ../auth-kit \
              || echo "::warning::neuronection/auth-kit not fetchable — required while pyproject.toml pins it as an editable ../auth-kit path dep"
          fi
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Python 3.12 (deadsnakes) and WebKitGTK build dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-dev python3.12-venv \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config file xvfb
      - run: uv sync --frozen
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv run --directory backend python -c 'import app; print(app.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match app version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Download appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build deb + AppImage
        run: |
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            packaging/build-linux.sh all
      - name: Smoke test (headless web mode)
        env:
          SA_DATA_DIR: ${{ runner.temp }}/sa-data
          SA_PORT: "8975"
        run: |
          backend/dist/studyassistant/studyassistant web &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8975/api/v1/health | grep -q '"ok"'; then exit 0; fi
            sleep 1
          done
          echo "health check timed out" >&2
          exit 1
      - name: Smoke test (desktop launch under xvfb, stripped deb stage)
        env:
          SA_DATA_DIR: ${{ runner.temp }}/sa-data-desktop
        run: |
          set +e
          WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout 30 xvfb-run -a \
            packaging/_deb/usr/lib/studyassistant/studyassistant \
            > "$RUNNER_TEMP/desktop-smoke.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktop launch exited with $code (expected 124 = survived):" >&2
            cat "$RUNNER_TEMP/desktop-smoke.log" >&2
            exit 1
          fi
          echo "desktop launch survived 30s"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packaging/*.deb
            packaging/*.AppImage
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (editable path dep)
        shell: bash
        run: |
          if [ ! -d ../auth-kit ]; then
            git clone --depth 1 https://github.com/neuronection/auth-kit ../auth-kit \
              || echo "::warning::neuronection/auth-kit not fetchable — required while pyproject.toml pins it as an editable ../auth-kit path dep"
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(uv run --directory backend python -c 'import app; print(app.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match app version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: PyInstaller onefile exe
        env:
          SA_ONEFILE: "1"
        run: uv run --directory backend pyinstaller --clean --noconfirm ../packaging/studyassistant.spec
      - name: Smoke test (headless web mode)
        env:
          SA_DATA_DIR: ${{ runner.temp }}\sa-data
          SA_PORT: "8975"
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "backend/dist/StudyAssistant.exe" -ArgumentList "web" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 2
            $health = curl.exe -fsS --noproxy '*' --max-time 5 http://127.0.0.1:8975/api/v1/health 2>$null
            if ($LASTEXITCODE -eq 0 -and "$health" -match '"status"\s*:\s*"ok"') { $ok = $true; break }
          }
          taskkill /PID $p.Id /T /F 2>$null
          if (-not $ok) { throw "health check timed out" }
      - name: Rename artifact
        shell: pwsh
        run: |
          $version = (uv run --directory backend python -c 'import app; print(app.__version__)').Trim()
          Copy-Item "backend/dist/StudyAssistant.exe" "packaging/StudyAssistant-$version-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: packaging/StudyAssistant-*-windows-x64.exe
          if-no-files-found: error

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - name: Provide family auth-kit (editable build dep)
        run: |
          if [ ! -d ../auth-kit ]; then
            git clone --depth 1 https://github.com/neuronection/auth-kit ../auth-kit \
              || echo "::warning::neuronection/auth-kit not fetchable — the image build needs it (named context `auth-kit`, see docker/Dockerfile)"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: auth-kit=../auth-kit
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
          pattern: "{linux-packages,windows-executable}"
      - name: Create stable-name download aliases
        working-directory: release
        run: |
          cp StudyAssistant-*-windows-x64.exe StudyAssistant-windows-x64.exe
          cp StudyAssistant-*-x86_64.AppImage StudyAssistant-x86_64.AppImage
          cp studyassistant_*_amd64.deb studyassistant_amd64.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
