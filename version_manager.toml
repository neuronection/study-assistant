# Study Assistant — version manager config (family-unified script)
# Family-unified script — do not fork; keep in sync with the internal standards distribution

[project]
name = "Study Assistant"

[version]
file = "backend/app/__init__.py"
pattern = '__version__\s*=\s*"(?P<version>[^"]+)"'

[[propagate]]
name = "Frontend package.json"
file = "frontend/package.json"
type = "json"
field = "version"

# CHANGELOG rides the release commit per the family docs-sync discipline.
# The exported OpenAPI schema embeds the app version (info.version), so the
# regenerated schema is staged with the release commit too (see the release
# runbook: bump → regenerate → amend → release; local commit + tag by
# default, --push only when explicitly asked — family-release skill).

[release]
tag_prefix = "v"
docs = ["CHANGELOG.md", "frontend/openapi.json"]
