# Study Assistant — version manager config
# The script (scripts/version_manager.py) is config-driven; edit this file,
# not the script.

[project]
name = "Study Assistant"

[version]
file = "backend/app/__init__.py"
pattern = '__version__\s*=\s*"(?P<version>[^"]+)"'

[[propagate]]
name = "Frontend package.json"
file = "frontend/package.json"
type = "json"
field = "version"

# STATUS is the single source of truth for the current phase and version.
# ADR-206: the header is auto-derived here so it can never go stale again.
[[propagate]]
name = "STATUS phase header"
file = "docs/STATUS.md"
type = "regex"
pattern = '\*\*Current phase: [^\n]*\*\* \(v(?P<version>[^;)]+)'

# CHANGELOG rides the release commit (docs and code change together).
# The exported OpenAPI schema embeds the app version (info.version), so the
# regenerated schema is staged with the release commit too (release flow:
# bump → regenerate → amend → release; local commit + tag by
# default, --push only when explicitly asked).

[release]
tag_prefix = "v"
docs = ["CHANGELOG.md", "frontend/openapi.json"]
