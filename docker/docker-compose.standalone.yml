# Study Assistant — standalone self-hosted stack (db + app + nginx + backup).
#
# Canonical single-host web deployment per deployment.md / ADR-0022: web mode
# runs PostgreSQL 16 (pgvector/pgvector — the embeddings schema uses pgvector).
# Docker Compose is the process supervisor, nginx routes traffic and terminates
# TLS. Mirrors Career Assistant's docker-compose.standalone.yml. (Desktop
# installs stay on SQLite at <data_dir>/study.sqlite3 — that convention does
# not apply to this stack.)
#
#   cp docker/.env.production.example docker/.env   # then set SA_DB_PASSWORD
#   docker compose -f docker/docker-compose.standalone.yml up -d --build
#   # scheduled DB + data backups: add --profile backup
#
# TLS: mount docker/nginx-TLS.conf over nginx.conf, uncomment the 443
# mapping, and provide certs (see docker/README.md → TLS). HTTP-only by
# default — fine for loopback/VPN, not for the open internet.

name: study-assistant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  db:
    image: pgvector/pgvector:pg16 # pgvector provisioned; embeddings migrations need it
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SA_DB_NAME:-neuronection_study}
      POSTGRES_USER: neuronection_study_owner
      POSTGRES_PASSWORD: ${SA_DB_PASSWORD:?Set SA_DB_PASSWORD in docker/.env (see docker/.env.production.example)}
      SA_DB_APP_USER: neuronection_study_app
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronection_study_owner -d ${SA_DB_NAME:-neuronection_study}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - study-assistant-network

  migrate:
    # One-shot migrations (plan 20 Phase 4, D6): `entrypoint.sh migrate`
    # applies the owner-role DDL and exits; the app never runs migrations.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${STUDY_IMAGE:-study-assistant:local}
    init: true
    restart: "no"
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_DATA_DIR: /data
      SA_DB_NAME: ${SA_DB_NAME:-neuronection_study}
      SA_DB_USER: neuronection_study_app
      SA_DB_PASSWORD: ${SA_DB_PASSWORD}
      SA_DB_HOST: db
      SA_DB_PORT: "5432"
      SA_DATABASE_URL: postgresql+psycopg://neuronection_study_app:${SA_DB_PASSWORD}@db:5432/${SA_DB_NAME:-neuronection_study}
      SA_MIGRATIONS_DATABASE_URL: postgresql+psycopg://neuronection_study_owner:${SA_DB_PASSWORD}@db:5432/${SA_DB_NAME:-neuronection_study}
    logging: *default-logging
    networks:
      - study-assistant-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${STUDY_IMAGE:-study-assistant:local}
    restart: unless-stopped
    init: true
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SA_DEBUG: "0"
      SA_PORT: 8000
      SA_HOST: 0.0.0.0
      SA_DATA_DIR: /data
      SA_SPA_DIST: /app/frontend/dist
      # Per-instance key family (identity-auth §8) — pinned in docker/.env.
      SA_SESSION_KEY: ${SA_SESSION_KEY:?Set SA_SESSION_KEY in docker/.env}
      SA_REFRESH_KEY: ${SA_REFRESH_KEY:?Set SA_REFRESH_KEY in docker/.env}
      SA_DATA_KEY: ${SA_DATA_KEY:?Set SA_DATA_KEY in docker/.env}
      # ADR-0022: web mode runs PostgreSQL 16. SA_DATABASE_URL wins over the
      # SA_DB_* credentials (keep the password URL-safe — it is embedded in
      # the URLs). Runtime connects as the least-privilege app role.
      SA_DB_NAME: ${SA_DB_NAME:-neuronection_study}
      SA_DB_USER: neuronection_study_app
      SA_DB_PASSWORD: ${SA_DB_PASSWORD}
      SA_DB_HOST: db
      SA_DB_PORT: "5432"
      SA_DATABASE_URL: postgresql+psycopg://neuronection_study_app:${SA_DB_PASSWORD}@db:5432/${SA_DB_NAME:-neuronection_study}
      # Migrations run in the one-shot `migrate` service below (owner
      # role) — the app process itself never runs DDL (plan 20 Phase 4).
      SA_MIGRATIONS_DATABASE_URL: postgresql+psycopg://neuronection_study_owner:${SA_DB_PASSWORD}@db:5432/${SA_DB_NAME:-neuronection_study}
    # No host ports: all traffic is routed via the nginx service.
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3); sys.exit(0 if r.status < 500 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - study-assistant-network

  backup:
    # Scheduled instance backups (database dump + data volume) written to the
    # ./backups bind mount (= docker/backups/). Enable with --profile backup.
    # Host-side one-shots incl. manifests: scripts/backup.sh + scripts/restore.sh.
    image: pgvector/pgvector:pg16 # pg_dump from the same image as the server
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${SA_DB_PASSWORD}
      PGHOST: db
      POSTGRES_DB: ${SA_DB_NAME:-neuronection_study}
      POSTGRES_USER: neuronection_study_owner
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - data:/data:ro
    command: >
      sh -c 'while true; do
        ts=$$(date -u +%Y%m%d-%H%M%S);
        pg_dump -U $$POSTGRES_USER -Fc $$POSTGRES_DB > /backups/db-$$ts.dump;
        tar czf /backups/data-$$ts.tar.gz -C /data . || true;
        find /backups -name "db-*.dump" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        find /backups -name "data-*.tar.gz" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        sleep $$((BACKUP_INTERVAL_HOURS * 3600));
      done'
    logging: *default-logging
    networks:
      - study-assistant-network

  nginx:
    image: nginx:alpine
    container_name: study-assistant-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment when serving TLS (see nginx-TLS.conf):
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS variant (also swap the conf mount above):
      # - ./nginx-TLS.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    logging: *default-logging
    networks:
      - study-assistant-network

volumes:
  db_data:
  data:

networks:
  study-assistant-network:
    driver: bridge
