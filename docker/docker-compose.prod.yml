# Study Assistant — production stack (db + app + backup; proxy handled
# externally or via docker-compose.standalone.yml, which ships the family
# nginx flavor).
#
#   cp docker/.env.production.example docker/.env   # then set SA_DB_PASSWORD
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#   # scheduled DB + data backups: add --profile backup
#
# Registry images (built by the release workflow): set
# STUDY_IMAGE=ghcr.io/<owner>/<repo>:<tag> instead of building locally.
#
# The app port is bound to 127.0.0.1 only — put a proxy in front for public
# traffic. Host port knob: SA_PORT (default 8200, study's backend band); the
# container always listens on 8000 (SA_PORT is pinned in the service env).

name: study-assistant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  db:
    image: pgvector/pgvector:pg16 # pgvector provisioned; embeddings migrations need it
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SA_DB_NAME:-neuronection_study}
      POSTGRES_USER: neuronection_study_owner
      # ADR-0064: two roles, two credentials. The owner bootstraps the DB;
      # the app role gets SA_DB_APP_PASSWORD (the operator's SA_DB_PASSWORD).
      POSTGRES_PASSWORD: ${SA_DB_OWNER_PASSWORD:?Set SA_DB_OWNER_PASSWORD in docker/.env (see docker/.env.production.example)}
      SA_DB_APP_USER: neuronection_study_app
      SA_DB_APP_PASSWORD: ${SA_DB_PASSWORD:?Set SA_DB_PASSWORD in docker/.env (see docker/.env.production.example)}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronection_study_owner -d ${SA_DB_NAME:-neuronection_study}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  migrate:
    # One-shot migrations (plan 20 Phase 4, D6): `entrypoint.sh migrate`
    # resolves the ADR-0064 tri-state and runs — as the owner role only —
    # role bootstrap (app role + grants + default privileges + vector/pg_trgm),
    # Alembic and the checkpoint schema. The app never runs any of it.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${STUDY_IMAGE:-study-assistant:local}
    init: true
    restart: "no"
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_DATA_DIR: /data
      # Per-instance key family (identity-auth §8) — alembic boots the app
      # Settings (env.py); pinned in docker/.env.
      SA_SESSION_KEY: ${SA_SESSION_KEY:?Set SA_SESSION_KEY in docker/.env}
      SA_REFRESH_KEY: ${SA_REFRESH_KEY:?Set SA_REFRESH_KEY in docker/.env}
      SA_DATA_KEY: ${SA_DATA_KEY:?Set SA_DATA_KEY in docker/.env}
      SA_DB_NAME: ${SA_DB_NAME:-neuronection_study}
      SA_DB_USER: neuronection_study_app
      # Distinct secrets (ADR-0064): the owner DSN lives ONLY here; the app
      # role's SA_DB_APP_PASSWORD lets migrate bootstrap/sync the role.
      SA_DB_APP_PASSWORD: ${SA_DB_PASSWORD}
      SA_DB_HOST: db
      SA_DB_PORT: "5432"
      SA_DB_SPLIT: "1"
      SA_DATABASE_URL: postgresql+psycopg://neuronection_study_app:${SA_DB_PASSWORD}@db:5432/${SA_DB_NAME:-neuronection_study}
      SA_MIGRATIONS_DATABASE_URL: postgresql+psycopg://neuronection_study_owner:${SA_DB_OWNER_PASSWORD}@db:5432/${SA_DB_NAME:-neuronection_study}
    logging: *default-logging

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${STUDY_IMAGE:-study-assistant:local}
    restart: unless-stopped
    init: true
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SA_DEBUG: "0"
      SA_PORT: 8000
      SA_HOST: 0.0.0.0
      SA_DATA_DIR: /data
      SA_SPA_DIST: /app/frontend/dist
      # Family object storage (ADR-0057 / plan 55 P1). Empty defaults keep
      # the local volume; a cloud profile sets its provider block (see
      # docker/.env.production.example and docker/docker-compose.cloud.yml).
      # The app validates the resolved config at boot and fails loud.
      SA_CLOUD_PROFILE: ${SA_CLOUD_PROFILE:-}
      SA_OBJECT_STORAGE_BACKEND: ${SA_OBJECT_STORAGE_BACKEND:-}
      SA_OBJECT_STORAGE_REQUIRED: ${SA_OBJECT_STORAGE_REQUIRED:-false}
      SA_OBJECT_STORAGE_LOCAL_ROOT: ${SA_OBJECT_STORAGE_LOCAL_ROOT:-/data/blobs}
      # Intentionally unset by default: study's bootstrap binds an unset cap
      # to MAX_UPLOAD_MB (200 MB), not the contract's 100 MB default.
      SA_OBJECT_STORAGE_MAX_MB: ${SA_OBJECT_STORAGE_MAX_MB:-}
      SA_OBJECT_STORAGE_PRESIGN_TTL: ${SA_OBJECT_STORAGE_PRESIGN_TTL:-300}
      SA_S3_BUCKET: ${SA_S3_BUCKET:-}
      SA_S3_REGION: ${SA_S3_REGION:-}
      SA_S3_ENDPOINT_URL: ${SA_S3_ENDPOINT_URL:-}
      SA_S3_ACCESS_KEY_ID: ${SA_S3_ACCESS_KEY_ID:-}
      SA_S3_SECRET_ACCESS_KEY: ${SA_S3_SECRET_ACCESS_KEY:-}
      SA_S3_SESSION_TOKEN: ${SA_S3_SESSION_TOKEN:-}
      SA_S3_PATH_STYLE: ${SA_S3_PATH_STYLE:-}
      SA_S3_SSE: ${SA_S3_SSE:-}
      SA_S3_KMS_KEY_ID: ${SA_S3_KMS_KEY_ID:-}
      SA_S3_PREFIX: ${SA_S3_PREFIX:-}
      SA_S3_VERIFY_TLS: ${SA_S3_VERIFY_TLS:-}
      SA_S3_CONNECT_TIMEOUT: ${SA_S3_CONNECT_TIMEOUT:-}
      SA_S3_READ_TIMEOUT: ${SA_S3_READ_TIMEOUT:-}
      SA_S3_MAX_ATTEMPTS: ${SA_S3_MAX_ATTEMPTS:-}
      SA_AZURE_STORAGE_CONTAINER: ${SA_AZURE_STORAGE_CONTAINER:-}
      SA_AZURE_STORAGE_CONNECTION_STRING: ${SA_AZURE_STORAGE_CONNECTION_STRING:-}
      SA_AZURE_STORAGE_ACCOUNT_URL: ${SA_AZURE_STORAGE_ACCOUNT_URL:-}
      SA_AZURE_STORAGE_ACCOUNT_NAME: ${SA_AZURE_STORAGE_ACCOUNT_NAME:-}
      SA_AZURE_STORAGE_CREDENTIAL: ${SA_AZURE_STORAGE_CREDENTIAL:-}
      SA_AZURE_STORAGE_PREFIX: ${SA_AZURE_STORAGE_PREFIX:-}
      SA_AZURE_CONNECT_TIMEOUT: ${SA_AZURE_CONNECT_TIMEOUT:-}
      SA_AZURE_READ_TIMEOUT: ${SA_AZURE_READ_TIMEOUT:-}
      SA_AZURE_MAX_ATTEMPTS: ${SA_AZURE_MAX_ATTEMPTS:-}
      # ADR-0022/ADR-0064: web mode runs PostgreSQL 16 and connects as the
      # least-privilege app role. SA_DATABASE_URL wins over the SA_DB_*
      # credentials (keep the password URL-safe — it is embedded in the
      # URL). The owner DSN is deliberately absent from this service: it
      # lives only in the one-shot migrate service above, and the
      # entrypoint refuses a serving env that carries it.
      SA_DB_NAME: ${SA_DB_NAME:-neuronection_study}
      SA_DB_USER: neuronection_study_app
      SA_DB_PASSWORD: ${SA_DB_PASSWORD}
      SA_DB_HOST: db
      SA_DB_PORT: "5432"
      SA_DATABASE_URL: postgresql+psycopg://neuronection_study_app:${SA_DB_PASSWORD}@db:5432/${SA_DB_NAME:-neuronection_study}
      # --- Cookie/proxy derivation (ADR-0062 v7 §9, plan 64 §1.6) -------
      # `Secure` is derived from the public scheme: SA_PUBLIC_URL (or the
      # SA_TLS override), never a static true — so LAN/VPN logins over
      # HTTP keep working. Leave SA_COOKIE_SECURE unset in compose; only
      # an explicit operator override (rare) pins it.
      SA_COOKIE_SECURE: ${SA_COOKIE_SECURE:-}
      SA_PUBLIC_URL: ${SA_PUBLIC_URL:-}
      SA_TLS: ${SA_TLS:-}
      # How many rightmost X-Forwarded-For hops to believe: 0 when the app
      # port is exposed directly (the prod default, 127.0.0.1-bound), 1
      # behind exactly one proxy; set per deployment under a BYO chain.
      SA_TRUSTED_PROXY_COUNT: ${SA_TRUSTED_PROXY_COUNT:-0}
    ports:
      # Bound to localhost only — put a proxy in front for public traffic
      # (docker-compose.standalone.yml ships the family nginx flavor).
      - "127.0.0.1:${SA_PORT:-8200}:8000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3); sys.exit(0 if r.status < 500 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  backup:
    # Scheduled instance backups (database dump + data volume) written to the
    # ./backups bind mount (= docker/backups/). Enable with --profile backup.
    # Host-side one-shots incl. manifests: scripts/backup.sh + scripts/restore.sh.
    image: pgvector/pgvector:pg16 # pg_dump from the same image as the server
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${SA_DB_OWNER_PASSWORD}
      PGHOST: db
      POSTGRES_DB: ${SA_DB_NAME:-neuronection_study}
      POSTGRES_USER: neuronection_study_owner
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Under a cloud profile the blob bytes live in the provider; the
      # sidecar must not tar /data blindly (it only holds secrets/cache).
      SA_CLOUD_PROFILE: ${SA_CLOUD_PROFILE:-}
      SA_OBJECT_STORAGE_BACKEND: ${SA_OBJECT_STORAGE_BACKEND:-local}
    volumes:
      - ./backups:/backups
      - data:/data:ro
      - ./backup-sidecar.sh:/usr/local/bin/backup-sidecar.sh:ro
    command: ["sh", "/usr/local/bin/backup-sidecar.sh"]
    logging: *default-logging

volumes:
  db_data:
  data:
