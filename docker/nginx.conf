# Study Assistant — Docker Nginx Configuration (Standalone Flavor)
#
# ⚠️ HTTP-ONLY — for local dev / VPN / loopback use.
#
# Internet-facing deployments MUST serve over TLS: copy
# nginx-TLS.conf over this file (or point the compose volume at it) and
# mount certificates (see docker/README.md → TLS). Study data and API keys
# (OS keyring entries live server-side in web mode) must never cross the
# network in cleartext.
#
# The app image is same-origin: uvicorn serves the API (/api), WebSocket
# (/ws) and the built SPA (/) from one process on :8000, so every location
# proxies to the same upstream.

server {
    listen 80;
    server_name _; # Catch-all, or replace with your domain

    # Keep in sync with SA_MAX_UPLOAD_MB if the backend enforces one.
    client_max_body_size 64m;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Backend API (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000;

        # Extended timeouts for long-running requests (AI generation).
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;

        # Streaming responses (SSE): flush immediately, never buffer.
        proxy_buffering off;
    }

    # 2. WebSocket endpoint (tutor chat stream). Route is exactly `/ws`
    #    (plus subpaths); no trailing slash so /ws itself matches.
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3. Backend health check.
    location = /api/v1/health {
        proxy_pass http://backend:8000;
    }

    # 4. Frontend (React SPA build served by the backend).
    # This must be the last block to act as a catch-all for React Router routes.
    location / {
        proxy_pass http://backend:8000;
    }
}
