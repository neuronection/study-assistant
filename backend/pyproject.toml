[project]
name = "studyassistant"
description = "AI-powered, local-first desktop study workbench"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    # Family auth kit — resolved by [tool.uv.sources] below to the pinned
    # git SHA (never PyPI while the org is pending — and a bare name there
    # would be squat-able). Direct URLs can't live in core metadata, so
    # the pin is the uv source's `rev`. Phase 0.8 (PyPI) switches it to
    # the published `neuronection-auth-kit==X.Y.Z`.
    "neuronection-auth-kit",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "keyring>=25",
    "langchain-anthropic>=1.6,<2",
    "langchain-core>=1.6,<2",
    "langchain-google-genai>=4.3,<5",
    "langchain-openai>=1.6,<2",
    # Plan 52 T5a: exact local token counting for the curated embedding
    # models. The encoding ships as data under app/data/tokenizers — never
    # fetched at request or boot time.
    "tiktoken>=0.14,<0.15",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pymupdf>=1.24",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pygobject>=3.50,<3.51 ; sys_platform == 'linux'",
    "python-multipart>=0.0.20",
    "pywebview>=5.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "sympy>=1.13",
    "uvicorn[standard]>=0.34",
    "sqlite-vec>=0.1.9",
    "mcp>=1.7",
    "pillow>=11",
    "html2text>=2025.4.15",
    "mammoth>=1.12.1",
    "python-pptx>=1.0.2",
    "ebooklib>=0.20",
    "mutagen>=1.48.1",
    "yt-dlp>=2025.1",
    "feedparser>=6.0",
    "psycopg[binary]>=3.2",
    "typesafe-sdk>=0.7,<0.8",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.4",
]
dynamic = ["version"]

[project.scripts]
studyassistant = "app.shell:run"

[dependency-groups]
dev = [
    "filelock>=3.32.3",
    "httpx>=0.28",
    "mypy>=1.14",
    "pyinstaller>=6.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "studyassistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored family contract modules must stay BYTE-identical to their dev
# canonicals (ADR-0031/0035/0040) — excluded from the formatter too, since
# `ruff format` does not honor the lint per-file-ignores below and would
# reflow them (plan 81 C review, 2026-10-21).
extend-exclude = [
    "app/extensions/contract.py",
    "app/extensions/polite_http.py",
    "app/extensions/conformance.py",
    "app/extensions/search/providers_contract.py",
    # Cloud-connector contract (ADR-0052): vendored byte-identical from
    # the family contract canonical via the sync tooling — lint findings belong to
    # the family canonical, never to a vendored copy (same accommodation as
    # contract.py above).
    "app/extensions/cloud/cloud_calendar.py",
    "app/extensions/cloud/cloud_files.py",
    "app/extensions/cloud/cloud_providers.py",
    # Family retrieval-operations contract (plan 51 Q0): vendored
    # byte-identical from the family contract canonical — lint findings belong to the family
    # canonical, never to this copy.
    "app/storage/retrieval_ops.py",
    # Family vector-retrieval and tokenizer/chunk contracts (plan 50 /
    # plan 52): vendored byte-identical from the family canonical.
    "app/storage/vector_contract.py",
    "app/storage/tokenizer_contract.py",
    "tests/cloud_conformance.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/sync-ai-presets.mjs from the dev canonical
# contracts/ai-presets.json — never hand-edited; long decision-model data
# lines are exempt (the byok gate's R1 guards the data, not ruff).
"app/ai/providers/presets_data.py" = ["E501"]
# Vendored family contract modules (byte-identical dev-canonical copies via
# the sync scripts — ADR-0031/ADR-0035/ADR-0040): lint findings belong in
# the dev canonical, not the vendored copy; drift is gated by the sync
# ledgers + verify-wiring.
"app/extensions/polite_http.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/extensions/contract.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/extensions/conformance.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/extensions/search/providers_contract.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/storage/retrieval_ops.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/storage/vector_contract.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
"app/storage/tokenizer_contract.py" = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.format]
# The generated presets module (sync-ai-presets.mjs from the dev canonical)
# is not formatter-stable — its long decision-model dict lines are emitted
# deliberately and lint-ignored above (plan 26 Phase 6: the family-wide
# accommodation; the byok gate's R1 guards the data, not ruff).
exclude = ["app/ai/providers/presets_data.py"]

[tool.mypy]
strict = true
# The vendored extension-contract canonical (backend/app/extensions/contract.py)
# is byte-identical to the family extension contract — never edited in-repo, and
# mypy-strict compliance is the family canonical's duty (career carries the same
# exclusion; the unification wave's sync introduced strict-mode findings here).
exclude = ["^dist/", "app/extensions/contract.py", "app/storage/retrieval_ops.py", "app/storage/vector_contract.py", "app/storage/tokenizer_contract.py"]

[[tool.mypy.overrides]]
module = ["webview", "fitz", "sqlite_vec", "sympy", "sympy.parsing.sympy_parser", "filelock", "mammoth", "ebooklib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored cloud-connector contract runtime (family canonical,
# byte-identical, never edited here — ADR-0052): type findings belong in the
# family canonical, not the vendored copy. Drift is gated by
# scripts/sync-cloud-connectors.sh --check on the dev side and by the fixture
# wall (tests/test_cloud_contract.py) here.
# (The extension contract above carries the same accommodation per pyproject.)
module = [
    "app.extensions.cloud.cloud_calendar",
    "app.extensions.cloud.cloud_files",
    "app.extensions.cloud.cloud_providers",
    "cloud_conformance",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Vendored family contract runtime (family canonical, byte-identical,
# never edited here — ADR-0031/ADR-0040): type findings belong in the dev
# canonical, not the vendored copy. Drift is gated by this repo's
# scripts/check-extensions-structure.sh plus the dev-side
# the family contract sync tooling / the family wiring verifier
# (both live in the family dev repo, not here).
# (career/health carry the same accommodation per pyproject.)
module = ["app.extensions.polite_http"]
ignore_errors = true

[[tool.mypy.overrides]]
# The family retrieval-operations fixture wall drives the vendored contract
# with dynamic JSON payloads (same shape as dev's checker); it is a runtime
# acceptance table, not typed application code.
module = [
    "tests.test_retrieval_ops_contract",
    "test_retrieval_ops_contract",
    "tests.test_vector_contract",
    "test_vector_contract",
    "tests.test_tokenizer_contract",
    "test_tokenizer_contract",
    "tests.test_tokenizer_service",
    "test_tokenizer_service",
    "tests.test_token_accounting",
    "test_token_accounting",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    # identity-auth §18 contract cases — the drift gate against the family
    # test kit (CI runs `pytest -m contract` as an explicit step).
    "contract: implements an identity-auth §18 contract case (family drift gate)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
